version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Covers pyproject.toml and uv.lock: Dependabot handles uv
  # through the pip ecosystem.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/gcp"
    schedule:
      interval: "weekly"
